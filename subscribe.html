      <nav>
        <a href="blog.html">Blog</a>
        <a href="about.html">About</a>

    <h1 class="sr">Subscribe</h1>

    <p class="prose intro">Want the latest post by email? Sign up below. Posts go out through Substack, and you can unsubscribe any time.</p>

    <form class="signup" action="https://loks.substack.com/api/v1/free?nojs=true" method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" inputmode="email" placeholder="you@example.com">
      <input type="hidden" name="first_url" value="">
      <input type="hidden" name="first_referrer" value="">
      <input type="hidden" name="current_url" value="">
      <input type="hidden" name="current_referrer" value="">
      <input type="hidden" name="source" value="subscribe-page">
      <button type="submit">Subscribe</button>
    </form>

    <ul class="contact">
      <li><a href="mailto:jacob@lokshin.co">Email</a></li>
      <li><a href="https://www.linkedin.com/in/jlokshin/" rel="noopener" target="_blank">LinkedIn</a></li>
      <li><a href="https://substack.com/@loks" rel="noopener" target="_blank">Substack</a></li>
    </ul>

    <p class="foot">© Jacob Lokshin</p>
  </div>
  <script>
    (function () {
      var f = document.querySelector('.signup'); if (!f) return;
      var set = function (n, v) { var i = f.elements[n]; if (i) i.value = v; };
      set('first_url', location.href); set('current_url', location.href);
      set('first_referrer', document.referrer); set('current_referrer', document.referrer);
    })();
  </script>
