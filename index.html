  var root=document.querySelector('.stage'), art=document.querySelector('.art');
  function clash(){
    var a=art.getBoundingClientRect(); if(!a.width) return false; var s=a.width/W;
    var items=document.querySelectorAll('.menu a'), pad=14;
    for(var i=0;i<items.length;i++){
      var r=items[i].getBoundingClientRect();
      var y0=Math.max(0,Math.floor((r.top-pad-a.top)/s/B)), y1=Math.min(P.length-1,Math.floor((r.bottom+pad-a.top)/s/B));
      for(var y=y0;y<=y1;y++){ if(a.left+P[y]*s < r.right+pad) return true; }
    }
    return false;
  }
  function fit(){
    var f=1; root.style.setProperty('--fit',f);
    while(clash() && f>0.55){ f=Math.round((f-0.03)*100)/100; root.style.setProperty('--fit',f); }
  }
  fit(); addEventListener('resize',fit); if(document.fonts) document.fonts.ready.then(fit);
})();
